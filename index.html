<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Apply the saved theme before first paint so there is no flash -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <!-- SEO -->
  <title>Sanket Sonkusare | Forward Deployed Engineer</title>
  <meta name="description"
    content="Sanket Sonkusare is a Forward Deployed Engineer at DevRev in Bengaluru, India. He builds AI and data systems: connectors, workflows and multi-agent RAG. See his experience, projects and education." />
  <meta name="author" content="Sanket Sonkusare" />
  <meta name="keywords"
    content="Sanket Sonkusare, Forward Deployed Engineer, DevRev, AI Engineer, LangChain, FastAPI, BigQuery, Snowflake, Portfolio" />
  <link rel="canonical" href="https://sanketsonkusare.me/" />
  <meta name="theme-color" content="#0a0b0d" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->

    content="Forward Deployed Engineer at DevRev. I build AI and data systems. See my experience and projects." />
